<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit catch · b8fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css?v=13" />
<link rel="stylesheet" href="dashboard.css?v=13" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <div id="header-mount"></div>

    <main class="app-main" style="max-width:560px; margin-inline:auto;">
      <div class="page-head" style="margin-bottom:0;">
        <div>
          <p class="eyebrow">Edit catch</p>
          <h1 class="page-title" id="catch-title" style="font-size:28px;">Loading…</h1>
          <div class="text-muted" style="font-size:14px;" id="catch-sub"></div>
        </div>
      </div>

      <div id="error-state" style="display:none;" class="panel" >
        <p class="text-muted" id="error-text"></p>
        <a href="my-catches.html" class="btn btn-secondary" style="align-self:flex-start;">Back to My Catches</a>
      </div>

      <form id="edit-form" class="panel" style="display:none; margin-top:24px; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="length" class="eyebrow">Length</label>
          <input class="input" id="length" type="text" placeholder="e.g. 18.5&quot;" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="weight" class="eyebrow">Weight (lb)</label>
          <input class="input" id="weight" type="number" step="0.1" min="0" placeholder="e.g. 3.2" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="depth" class="eyebrow">Depth</label>
          <input class="input" id="depth" type="text" placeholder="e.g. 8 ft" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="retrieve" class="eyebrow">Retrieve style</label>
          <input class="input" id="retrieve" type="text" placeholder="e.g. slow roll" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="structure-category" class="eyebrow">Structure category</label>
          <select class="input" id="structure-category"></select>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="structure-type" class="eyebrow">Structure</label>
          <select class="input" id="structure-type"></select>
        </div>

        <div id="form-error" class="text-muted" style="font-size:13px; color:var(--series-orange); display:none;"></div>

        <div style="display:flex; gap:10px;">
          <button class="btn btn-accent btn-lg" type="submit" id="save-btn">Save</button>
          <a href="my-catches.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </main>
  </div>

  <script src="config.js?v=13"></script>
  <script src="session.js?v=13"></script>
  <script src="components.js?v=13"></script>
  <script>
    // Same closed taxonomy as the app's StructureCatalog.swift — kept in
    // sync by hand since there's no shared code between Swift and JS.
    const STRUCTURE_CATALOG = {
      "Bottom Contour": ["Point", "Secondary Point", "Ledge", "Drop-off / Break Line", "Hump", "Saddle", "Island", "Channel Swing Bend", "Creek Channel", "Flat", "Pocket / Cove", "Bluff / Bluff Wall", "Bluff End", "Ditch / Drain", "Roadbed", "Old Pond / Foundation", "Rock Pile / Reef", "Shell Bed"],
      "Bottom Composition": ["Hard-Bottom Spot", "Transition Bank", "Riprap"],
      "Wood": ["Laydown", "Stump / Stump Field", "Standing Timber", "Brush Pile", "Cypress Trees / Knees", "Logjam / Root Wad"],
      "Vegetation": ["Grass Line / Weed Edge", "Matted Vegetation", "Lily Pads", "Reeds / Bulrush / Kissimmee Grass", "Hydrilla / Milfoil / Eelgrass / Coontail", "Grass Point"],
      "Man-Made": ["Docks / Boathouses", "Bridge Pilings", "Seawalls / Bulkheads", "Marinas", "Culverts / Drains", "Dams / Spillways / Tailraces", "Fish Attractors", "Canals", "Pier / Jetty"],
      "Current / Water": ["Current Break / Eddy", "Creek / River Mouth", "Mudline / Color Change", "Shade Line", "Thermocline", "Tidal Creeks / Cuts"],
    };

    function populateCategorySelect(selected) {
      const sel = document.getElementById("structure-category");
      sel.innerHTML = ['<option value="">None</option>']
        .concat(Object.keys(STRUCTURE_CATALOG).map(c => `<option value="${esc(c)}"${c === selected ? " selected" : ""}>${esc(c)}</option>`))
        .join("");
    }

    function populateTypeSelect(category, selected) {
      const sel = document.getElementById("structure-type");
      const options = STRUCTURE_CATALOG[category] || [];
      sel.innerHTML = ['<option value="">None</option>']
        .concat(options.map(t => `<option value="${esc(t)}"${t === selected ? " selected" : ""}>${esc(t)}</option>`))
        .join("");
      sel.disabled = options.length === 0;
    }

    (async function () {
      const session = await requireSession();
      if (!session) return;

      const ok = await requireIsPro(session.user);
      if (!ok) return;

      document.getElementById("header-mount").innerHTML = renderHeader("my-catches", session.user.email);
      wireHeaderSignOut();

      function showError(message) {
        document.getElementById("catch-title").textContent = "Catch not found";
        document.getElementById("error-text").textContent = message;
        document.getElementById("error-state").style.display = "flex";
      }

      const catchId = new URLSearchParams(location.search).get("id");
      if (!catchId) { showError("No catch was specified."); return; }

      const [{ data: catchRow, error: catchErr }, { data: waters }] = await Promise.all([
        supabaseClient.from("catches").select("*").eq("id", catchId).single(),
        supabaseClient.from("waters").select("id,name").eq("user_id", session.user.id),
      ]);

      if (catchErr || !catchRow) {
        showError("This catch doesn't exist, or isn't yours to edit.");
        return;
      }

      const waterName = (waters || []).find(w => w.id === catchRow.water_id)?.name;
      const d = new Date(catchRow.timestamp);
      document.getElementById("catch-title").textContent = catchRow.species;
      document.getElementById("catch-sub").textContent = [
        d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
        waterName,
        catchRow.lure_display_name_snapshot,
      ].filter(Boolean).join(" · ");

      document.getElementById("length").value = catchRow.length_text || "";
      document.getElementById("weight").value = catchRow.weight_lbs ?? "";
      document.getElementById("depth").value = catchRow.depth_at_catch || "";
      document.getElementById("retrieve").value = catchRow.retrieve_style || "";
      populateCategorySelect(catchRow.structure_category || "");
      populateTypeSelect(catchRow.structure_category || "", catchRow.structure_type || "");

      document.getElementById("structure-category").addEventListener("change", (e) => {
        populateTypeSelect(e.target.value, "");
      });

      document.getElementById("edit-form").style.display = "flex";
      document.getElementById("edit-form").style.flexDirection = "column";

      document.getElementById("edit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("save-btn");
        const errorEl = document.getElementById("form-error");
        errorEl.style.display = "none";
        saveBtn.disabled = true;

        const weightVal = document.getElementById("weight").value.trim();
        const payload = {
          length_text: document.getElementById("length").value.trim() || null,
          weight_lbs: weightVal ? parseFloat(weightVal) : null,
          depth_at_catch: document.getElementById("depth").value.trim() || null,
          retrieve_style: document.getElementById("retrieve").value.trim() || null,
          structure_category: document.getElementById("structure-category").value || null,
          structure_type: document.getElementById("structure-type").value || null,
        };

        const { error } = await supabaseClient.from("catches").update(payload).eq("id", catchId);
        if (error) {
          errorEl.textContent = error.message || "Couldn't save — try again.";
          errorEl.style.display = "block";
          saveBtn.disabled = false;
          return;
        }
        location.href = "my-catches.html";
      });
    })();
  </script>
</body>
</html>
