<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit lure · b8fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css?v=16" />
<link rel="stylesheet" href="dashboard.css?v=16" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <div id="header-mount"></div>

    <main class="app-main" style="max-width:560px; margin-inline:auto;">
      <div class="page-head" style="margin-bottom:0;">
        <div>
          <p class="eyebrow">Edit lure</p>
          <h1 class="page-title" id="lure-title" style="font-size:28px;">Loading…</h1>
          <div class="text-muted" style="font-size:14px;" id="lure-sub"></div>
        </div>
      </div>

      <div id="error-state" style="display:none;" class="panel">
        <p class="text-muted" id="error-text"></p>
        <a href="lures.html" class="btn btn-secondary" style="align-self:flex-start;">Back to Lures</a>
      </div>

      <form id="edit-form" class="panel" style="display:none; margin-top:24px; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="brand" class="eyebrow">Brand</label>
          <input class="input" id="brand" type="text" required />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="model-name" class="eyebrow">Model</label>
          <input class="input" id="model-name" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="color-pattern" class="eyebrow">Color / pattern</label>
          <input class="input" id="color-pattern" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="type" class="eyebrow">Type</label>
          <select class="input" id="type">
            <option value="crankbait">Crankbait</option>
            <option value="softPlastic">Soft plastic</option>
            <option value="spinner">Spinner</option>
            <option value="topwater">Topwater</option>
            <option value="jig">Jig</option>
            <option value="jerkbait">Jerkbait</option>
          </select>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="size" class="eyebrow">Size</label>
          <input class="input" id="size" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="weight" class="eyebrow">Weight</label>
          <input class="input" id="weight" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="hooks" class="eyebrow">Hooks</label>
          <input class="input" id="hooks" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="depth-range" class="eyebrow">Depth range</label>
          <input class="input" id="depth-range" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="diving-depth" class="eyebrow">Diving depth</label>
          <input class="input" id="diving-depth" type="text" />
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="stock-count" class="eyebrow">Stock</label>
          <input class="input" id="stock-count" type="number" min="0" max="99" step="1" />
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <input id="is-tied-on" type="checkbox" style="width:18px; height:18px;" />
          <label for="is-tied-on" style="font-size:14px;">Tied on now</label>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="pattern-notes" class="eyebrow">Notes</label>
          <input class="input" id="pattern-notes" type="text" />
        </div>

        <div class="text-muted" style="font-size:13px;">
          Photos stay app-only for now — this page can't change a lure's picture.
        </div>

        <div id="form-error" class="text-muted" style="font-size:13px; color:var(--series-orange); display:none;"></div>

        <div style="display:flex; gap:10px;">
          <button class="btn btn-accent btn-lg" type="submit" id="save-btn">Save</button>
          <a href="lures.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </main>
  </div>

  <script src="config.js?v=16"></script>
  <script src="session.js?v=16"></script>
  <script src="components.js?v=16"></script>
  <script>
    (async function () {
      const session = await requireSession();
      if (!session) return;

      const ok = await requireIsPro(session.user);
      if (!ok) return;

      document.getElementById("header-mount").innerHTML = renderHeader("lures", session.user.email);
      wireHeaderSignOut();

      function showError(message) {
        document.getElementById("lure-title").textContent = "Lure not found";
        document.getElementById("error-text").textContent = message;
        document.getElementById("error-state").style.display = "flex";
      }

      const lureId = new URLSearchParams(location.search).get("id");
      if (!lureId) { showError("No lure was specified."); return; }

      const { data: lure, error: lureErr } = await supabaseClient.from("lures").select("*").eq("id", lureId).single();

      if (lureErr || !lure) {
        showError("This lure doesn't exist, or isn't yours to edit.");
        return;
      }

      document.getElementById("lure-title").textContent = `${lure.brand} ${lure.model_name}`.trim();
      document.getElementById("lure-sub").textContent = lure.color_pattern || "";

      document.getElementById("brand").value = lure.brand || "";
      document.getElementById("model-name").value = lure.model_name || "";
      document.getElementById("color-pattern").value = lure.color_pattern || "";
      document.getElementById("type").value = lure.type || "crankbait";
      document.getElementById("size").value = lure.size || "";
      document.getElementById("weight").value = lure.weight || "";
      document.getElementById("hooks").value = lure.hooks_description || "";
      document.getElementById("depth-range").value = lure.depth_range || "";
      document.getElementById("diving-depth").value = lure.diving_depth || "";
      document.getElementById("stock-count").value = lure.stock_count ?? 1;
      document.getElementById("is-tied-on").checked = !!lure.is_tied_on;
      document.getElementById("pattern-notes").value = lure.pattern_notes || "";

      document.getElementById("edit-form").style.display = "flex";
      document.getElementById("edit-form").style.flexDirection = "column";

      document.getElementById("edit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("save-btn");
        const errorEl = document.getElementById("form-error");
        errorEl.style.display = "none";

        const brand = document.getElementById("brand").value.trim();
        if (!brand) {
          errorEl.textContent = "Brand can't be blank.";
          errorEl.style.display = "block";
          return;
        }
        saveBtn.disabled = true;

        const stockVal = document.getElementById("stock-count").value;
        const isTiedOn = document.getElementById("is-tied-on").checked;

        // The app only ever has one lure tied on at a time (Lure.tieOn in
        // the app) — replicate that here so the website can't leave two
        // lures tied on, a state the app never expects.
        if (isTiedOn) {
          const { error: untieErr } = await supabaseClient.from("lures")
            .update({ is_tied_on: false })
            .eq("user_id", session.user.id)
            .neq("id", lureId);
          if (untieErr) {
            errorEl.textContent = untieErr.message || "Couldn't save — try again.";
            errorEl.style.display = "block";
            saveBtn.disabled = false;
            return;
          }
        }

        const payload = {
          brand,
          model_name: document.getElementById("model-name").value.trim(),
          color_pattern: document.getElementById("color-pattern").value.trim(),
          type: document.getElementById("type").value,
          size: document.getElementById("size").value.trim(),
          weight: document.getElementById("weight").value.trim(),
          hooks_description: document.getElementById("hooks").value.trim(),
          depth_range: document.getElementById("depth-range").value.trim(),
          diving_depth: document.getElementById("diving-depth").value.trim(),
          stock_count: stockVal === "" ? 1 : Math.max(0, Math.min(99, parseInt(stockVal, 10))),
          is_tied_on: isTiedOn,
          pattern_notes: document.getElementById("pattern-notes").value.trim() || null,
        };

        const { error } = await supabaseClient.from("lures").update(payload).eq("id", lureId);
        if (error) {
          errorEl.textContent = error.message || "Couldn't save — try again.";
          errorEl.style.display = "block";
          saveBtn.disabled = false;
          return;
        }
        location.href = "lures.html";
      });
    })();
  </script>
</body>
</html>
