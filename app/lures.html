<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lures · b8fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css?v=7" />
<link rel="stylesheet" href="dashboard.css?v=7" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <div id="header-mount"></div>

    <main class="app-main">
      <div class="page-head">
        <div>
          <p class="eyebrow">Tackle box</p>
          <h1 class="page-title">Your Lures</h1>
          <div class="text-muted" style="font-size:14px;" id="lures-sub"></div>
        </div>
      </div>

      <section class="panel" id="lures-panel">
        <div id="lures-mount"></div>
      </section>
    </main>
  </div>

  <script src="config.js?v=7"></script>
  <script src="session.js?v=7"></script>
  <script src="components.js?v=7"></script>
  <script src="lures-data.js?v=7"></script>
  <script>
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    (async function () {
      const session = await requireSession();
      if (!session) return;

      const ok = await requireIsPro(session.user);
      if (!ok) return;

      document.getElementById("header-mount").innerHTML = renderHeader("lures", session.user.email);
      wireHeaderSignOut();

      const lures = await loadUserLures(supabaseClient, session.user.id);

      if (!lures.length) {
        document.getElementById("lures-sub").textContent = "No lures synced yet";
        document.getElementById("lures-mount").innerHTML = `
          <p class="text-muted" style="font-size:14px;">
            Lures you add in the app (brand, model, color, type, and the rest of your tackle box) will show up here once synced.
          </p>
        `;
        return;
      }

      document.getElementById("lures-sub").textContent = `${lures.length} lure${lures.length === 1 ? "" : "s"} synced from the app`;

      const shaped = lures.map(l => ({
        brand: l.brand,
        modelName: l.model_name,
        colorPattern: l.color_pattern,
        type: l.type,
        size: l.size,
        weight: l.weight,
        hooksDescription: l.hooks_description,
        depthRange: l.depth_range,
        divingDepth: l.diving_depth,
        stockCount: l.stock_count,
        isTiedOn: l.is_tied_on,
        patternNotes: l.pattern_notes,
        dateAddedDisplay: formatDate(l.date_added),
      }));

      document.getElementById("lures-mount").innerHTML = renderLuresTable(shaped);
    })();
  </script>
</body>
</html>
